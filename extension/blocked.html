<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>アクセスが制限されています</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4 font-sans text-slate-800">
  <div class="bg-white rounded-3xl shadow-xl border border-slate-200 p-8 max-w-lg w-full text-center space-y-6">
    <div class="w-20 h-20 mx-auto bg-amber-100 rounded-full flex items-center justify-center text-amber-600">
      <svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path>
      </svg>
    </div>

    <div class="space-y-2">
      <h1 class="text-2xl font-bold text-slate-800">アクセスが制限されています</h1>
      <p class="text-sm text-slate-600">
        授業中はこのWebサイトを開くことができません。<br>先生の指示に従って作業を進めてください。
      </p>
    </div>

    <div class="bg-slate-50 border border-slate-200 rounded-xl p-3 text-left">
      <div class="text-[11px] font-semibold text-slate-400 uppercase tracking-wider mb-1">ブロック対象URL</div>
      <div id="blockedUrl" class="text-xs text-slate-700 font-mono break-all truncate">-</div>
      <div class="mt-2 text-[11px] text-slate-400">
        規制モード: <span id="filterMode" class="font-bold text-slate-600">-</span>
      </div>
    </div>

    <div class="pt-2">
      <button onclick="window.history.back()" class="w-full bg-slate-800 hover:bg-slate-900 text-white font-semibold py-3 px-6 rounded-xl transition text-sm shadow-sm">
        前のページに戻る
      </button>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const url = params.get('url') || 'URL情報なし';
    const mode = params.get('mode') || 'RESTRICTED';

    document.getElementById('blockedUrl').textContent = url;
    document.getElementById('blockedUrl').title = url;

    let modeText = 'URL制限';
    if (mode === 'WHITELIST') modeText = '許可リスト制限（指定外Webサイト）';
    if (mode === 'BLACKLIST') modeText = '規制リスト制限（禁止Webサイト）';
    document.getElementById('filterMode').textContent = modeText;
  </script>
</body>
</html>
